<!doctype html><meta charset="utf-8"><title>PM workspace memory fixture</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,sans-serif;color:#233047;background:#f4f6fa}header{height:64px;padding:20px 28px;background:#fff;border-bottom:1px solid #ddd}main{display:grid;grid-template-columns:190px 1fr;min-height:750px}nav{padding:24px;background:#ecf0f6}article{padding:24px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,section{padding:20px;background:white;border-radius:10px;border:1px solid #e2e7ef}.card b{display:block;font-size:28px;margin-top:10px}section{margin-top:18px}table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #edf0f4}svg{width:100%;height:150px}button{padding:8px 12px;border:0;background:#326ef4;color:white;border-radius:6px}textarea{width:100%;height:160px;border:1px solid #ccd5e3;padding:12px}
</style><header><b>产品工作台 · 性能测试页</b></header><main><nav>需求列表<p>产品分析</p><p>协作文档</p><p>设计记录</p></nav><article><div class="cards"><div class="card">待处理需求<b>328</b></div><div class="card">进行中<b>46</b></div><div class="card">本周交付<b>19</b></div><div class="card">完成率<b>86%</b></div></div><section><h2>需求趋势</h2><svg viewBox="0 0 1000 150" id="chart"></svg></section><section><h2>产品文档</h2><textarea id="document"></textarea></section><section><h2>需求列表</h2><table id="rows"></table></section></article></main><script>
const run='%%RUN%%',tab=%%TAB%%,rows=document.querySelector('#rows'),fragment=document.createDocumentFragment();
for(let i=0;i<1000;i++){const row=document.createElement('tr');for(const text of ['需求 '+i,'产品经理','设计评审','2026-09-29']){const td=document.createElement('td');td.textContent=text;row.append(td);}fragment.append(row);}rows.append(fragment);
const svg=document.querySelector('#chart');for(let i=0;i<200;i++){const bar=document.createElementNS('http://www.w3.org/2000/svg','rect');bar.setAttribute('x',i*5);bar.setAttribute('y',150-(i*17%120+20));bar.setAttribute('width',3);bar.setAttribute('height',i*17%120+20);bar.setAttribute('fill','#5789f4');svg.append(bar);}
document.querySelector('#document').value=('产品需求与交互说明：保留页面状态和输入内容。\n').repeat(400);
function report(){fetch('/__bench/result/'+run,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'memory',tab,ready:true,rows:rows.rows.length,nodes:document.querySelectorAll('*').length,viewport:{width:innerWidth,height:innerHeight},containerViewport:{width:parent.innerWidth,height:parent.innerHeight},visible:!document.hidden,userAgent:navigator.userAgent})});}
window.addEventListener('load',()=>setTimeout(report,100));document.addEventListener('visibilitychange',report);
let resizeReport;window.addEventListener('resize',()=>{clearTimeout(resizeReport);resizeReport=setTimeout(report,150);});
</script>
