<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新标签页</title><style>
:root{color-scheme:light dark;--bg:#fff;--fg:#303238;--field:#f1f3f4;--muted:#77808b;--line:#dce0e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,BlinkMacSystemFont,sans-serif}.page{display:flex;min-height:100vh;align-items:center;flex-direction:column;padding:clamp(70px,16vh,150px) 24px 32px}.brand{display:flex;gap:13px;align-items:center;font-size:40px;font-weight:600;letter-spacing:-1px;margin-bottom:35px}.mark{font-size:39px;color:#5a8fbe}.brand small{font-size:13px;align-self:end;letter-spacing:2px;font-weight:400;padding-bottom:7px;color:var(--muted)}form{display:flex;align-items:center;gap:14px;max-width:580px;width:100%;height:48px;border-radius:26px;background:var(--field);padding:0 20px}form:focus-within{box-shadow:0 0 0 2px #7ba8d666}.search-icon{color:var(--muted);font-size:23px}input{border:0;background:transparent;color:inherit;font:inherit;outline:none;width:100%;height:100%}.quick{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;margin-top:35px;max-width:670px}a.quicklink{color:inherit;text-decoration:none;display:flex;width:86px;align-items:center;gap:12px;flex-direction:column;font-size:12px;padding:10px 4px;border-radius:10px}a.quicklink:hover{background:var(--field)}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--field);font-size:20px}.caption{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{position:fixed;bottom:24px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8;left:20px;right:20px}.hint a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}kbd{font-family:inherit}.private{display:none;padding:12px;color:var(--muted);max-width:500px;text-align:center;font-size:12px;line-height:1.8}@media(prefers-color-scheme:dark){:root{--bg:#202124;--fg:#e3e5e8;--field:#303134;--muted:#949ba5;--line:#43464c}}
</style></head><body><main class="page"><div class="brand"><img src="app-icon.png" alt="" width="52" height="52" style="vertical-align:middle;margin-right:12px">Pageglass</div><form id="search" action="https://www.google.com/search" method="get"><span class="search-icon">⌕</span><input name="q" aria-label="搜索网页" placeholder="搜索网页，或按 ⌘L 输入网址" autocomplete="off"></form><div id="private" class="private">当前处于无痕窗口。关闭后清除本窗口的网站会话，不保存浏览历史。下载文件和手动保存的书签仍会保留。</div><div class="quick" id="quicklinks"><a class="quicklink" href="https://www.figma.com"><span class="icon">F</span><span class="caption">Figma</span></a><a class="quicklink" href="https://github.com"><span class="icon">⌘</span><span class="caption">GitHub</span></a><a class="quicklink" href="https://developer.mozilla.org"><span class="icon">M</span><span class="caption">MDN</span></a><a class="quicklink" href="demo.html"><span class="icon">⌑</span><span class="caption">捕获练习</span></a></div><div class="hint"><kbd>⌘⇧C</kbd> 捕获元素　·　<kbd>⌘⇧A</kbd> 捕获整页<br><a href="demo.html">练习：选取页面，再交给 Codex 改原型</a></div></main></body></html>
